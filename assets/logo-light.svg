<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140" role="img" aria-label="serena-shared logo">
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="stream-light" gradientUnits="userSpaceOnUse" x1="18" y1="52" x2="68" y2="52">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="55%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#4f46e5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="55%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent-text-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Emblem -->
  <g transform="translate(18, 18)">
    <rect x="0" y="0" width="104" height="104" rx="24" fill="url(#bg-light)" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="74" cy="52" r="26" fill="url(#glow-light)"/>
    <g fill="none" stroke="url(#stream-light)" stroke-width="4.5" stroke-linecap="round">
      <path d="M 24 25 C 48 25, 49 52, 66 52"/>
      <path d="M 20 52 L 66 52"/>
      <path d="M 24 79 C 48 79, 49 52, 66 52"/>
    </g>
    <g fill="#ffffff" stroke="#0284c7" stroke-width="2.6">
      <circle cx="22" cy="25" r="4.8"/>
      <circle cx="18" cy="52" r="4.8"/>
      <circle cx="22" cy="79" r="4.8"/>
    </g>
    <g fill="#0284c7">
      <circle cx="22" cy="25" r="1.8"/>
      <circle cx="18" cy="52" r="1.8"/>
      <circle cx="22" cy="79" r="1.8"/>
    </g>
    <circle cx="74" cy="52" r="12.5" fill="#ffffff" stroke="url(#core-light)" stroke-width="3.6"/>
    <circle cx="74" cy="52" r="5.6" fill="url(#core-light)"/>
  </g>

  <!-- Wordmark -->
  <text x="148" y="76" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#1f2328">serena</tspan><tspan fill="url(#accent-text-light)">-shared</tspan>
  </text>
  <text x="150" y="106" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="500" letter-spacing="2.2" fill="#57606a">
    SHARED MCP MULTIPLEXER FOR SERENA
  </text>
</svg>
