<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="serena-shared icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="stream" gradientUnits="userSpaceOnUse" x1="46" y1="128" x2="170" y2="128">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)" stroke="#1e293b" stroke-width="4"/>

  <!-- Luminous core halo -->
  <circle cx="182" cy="128" r="56" fill="url(#glow)"/>

  <!-- Converging client streams -->
  <g fill="none" stroke="url(#stream)" stroke-width="10" stroke-linecap="round">
    <path d="M 62 66 C 118 66, 120 128, 162 128"/>
    <path d="M 52 128 L 162 128"/>
    <path d="M 62 190 C 118 190, 120 128, 162 128"/>
  </g>

  <!-- Input client nodes -->
  <g fill="#0f172a" stroke="#38bdf8" stroke-width="6">
    <circle cx="56" cy="66" r="11"/>
    <circle cx="46" cy="128" r="11"/>
    <circle cx="56" cy="190" r="11"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="56" cy="66" r="4"/>
    <circle cx="46" cy="128" r="4"/>
    <circle cx="56" cy="190" r="4"/>
  </g>

  <!-- Shared Serena core node -->
  <circle cx="182" cy="128" r="28" fill="#0f172a" stroke="url(#core)" stroke-width="8"/>
  <circle cx="182" cy="128" r="13" fill="url(#core)"/>
</svg>
