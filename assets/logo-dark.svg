<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140" role="img" aria-label="serena-shared logo">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="stream-dark" gradientUnits="userSpaceOnUse" x1="18" y1="52" x2="68" y2="52">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accent-text-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Emblem -->
  <g transform="translate(18, 18)">
    <rect x="0" y="0" width="104" height="104" rx="24" fill="url(#bg-dark)" stroke="#30363d" stroke-width="2"/>
    <circle cx="74" cy="52" r="26" fill="url(#glow-dark)"/>
    <g fill="none" stroke="url(#stream-dark)" stroke-width="4.5" stroke-linecap="round">
      <path d="M 24 25 C 48 25, 49 52, 66 52"/>
      <path d="M 20 52 L 66 52"/>
      <path d="M 24 79 C 48 79, 49 52, 66 52"/>
    </g>
    <g fill="#0f172a" stroke="#38bdf8" stroke-width="2.6">
      <circle cx="22" cy="25" r="4.8"/>
      <circle cx="18" cy="52" r="4.8"/>
      <circle cx="22" cy="79" r="4.8"/>
    </g>
    <g fill="#67e8f9">
      <circle cx="22" cy="25" r="1.8"/>
      <circle cx="18" cy="52" r="1.8"/>
      <circle cx="22" cy="79" r="1.8"/>
    </g>
    <circle cx="74" cy="52" r="12.5" fill="#0f172a" stroke="url(#core-dark)" stroke-width="3.6"/>
    <circle cx="74" cy="52" r="5.6" fill="url(#core-dark)"/>
  </g>

  <!-- Wordmark -->
  <text x="148" y="76" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#f0f6fc">serena</tspan><tspan fill="url(#accent-text-dark)">-shared</tspan>
  </text>
  <text x="150" y="106" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="500" letter-spacing="2.2" fill="#8b949e">
    SHARED MCP MULTIPLEXER FOR SERENA
  </text>
</svg>
